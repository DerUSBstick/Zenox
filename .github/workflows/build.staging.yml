name: Build & Push Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: derusbstick/zenox

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log into registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push bot image
        run: |
          docker build -f docker/Dockerfile -t ghcr.io/derusbstick/zenox:staging .
          docker push ghcr.io/derusbstick/zenox:staging

      - name: Build and push web image
        run: |
          docker build -f web/Dockerfile -t ghcr.io/derusbstick/zenox-web:staging web/
          docker push ghcr.io/derusbstick/zenox-web:staging
