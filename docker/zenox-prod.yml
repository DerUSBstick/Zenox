services:
  zenox-bot:
    image: ghcr.io/derusbstick/zenox:prod
    environment:
      - ENV=prod
      - API_PORT=8080
      - HOYOLAB_COOKIE_CACHE=/data/hoyolab_cookies.json
    volumes:
      - zenox-data:/data
    secrets:
      - source: zenox_prod_bot_token
        target: bot_token
      - source: zenox_prod_discord_dev_guild_id
        target: discord_dev_guild_id
      - source: zenox_prod_sentry_dsn
        target: sentry_dsn
      - source: zenox_prod_youtube_api_key
        target: youtube_api_key
      - source: zenox_prod_seeleland_api_url
        target: seeleland_api_url
      - source: zenox_prod_db_url
        target: db_url
      - source: zenox_prod_discord_webhook
        target: discord_webhook
      - source: zenox_prod_hoyolab_username
        target: hoyolab_username
      - source: zenox_prod_hoyolab_password
        target: hoyolab_password
    networks:
      - swarm-ops_private
      - zenox-prod_private
      - zenox-prod_public
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 256M
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      placement:
        constraints:
          - node.hostname == Lifty

  zenox-web:
    image: ghcr.io/derusbstick/zenox-web:prod
    environment:
      - BOT_UPSTREAM=zenox-bot:8080
    networks:
      - swarm-ops_private
      - zenox-prod_private
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M
      placement:
        constraints:
          - node.hostname == Lifty

volumes:
  zenox-data:

networks:
  swarm-ops_private:
    external: true
  zenox-prod_private:
    external: true
  zenox-prod_public:

secrets:
  zenox_prod_bot_token:
    external: true
  zenox_prod_discord_dev_guild_id:
    external: true
  zenox_prod_sentry_dsn:
    external: true
  zenox_prod_youtube_api_key:
    external: true
  zenox_prod_seeleland_api_url:
    external: true
  zenox_prod_db_url:
    external: true
  zenox_prod_discord_webhook:
    external: true
  zenox_prod_hoyolab_username:
    external: true
  zenox_prod_hoyolab_password:
    external: true
