version: "3.8"

services:
  zenox-bot-staging:
    image: ghcr.io/derusbstick/zenox:staging
    environment:
      - ENV=test
      - API_PORT=8080
      - HOYOLAB_COOKIE_CACHE=/data/hoyolab_cookies.json
    volumes:
      - zenox-staging-data:/data
    secrets:
      - source: zenox_staging_bot_token
        target: bot_token
      - source: zenox_staging_discord_dev_guild_id
        target: discord_dev_guild_id
      - source: zenox_staging_sentry_dsn
        target: sentry_dsn
      - source: zenox_staging_youtube_api_key
        target: youtube_api_key
      - source: zenox_staging_seeleland_api_url
        target: seeleland_api_url
      - source: zenox_staging_db_url
        target: db_url
      - source: zenox_staging_discord_webhook
        target: discord_webhook
      - source: zenox_staging_hoyolab_username
        target: hoyolab_username
      - source: zenox_staging_hoyolab_password
        target: hoyolab_password
    networks:
      - swarm-ops_private
      - zenox-staging_private
      - zenox-staging_public
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 256M
      placement:
        constraints:
          - node.hostname == Lifty

  zenox-web-staging:
    image: ghcr.io/derusbstick/zenox-web:staging
    environment:
      - BOT_UPSTREAM=zenox-bot-staging:8080
    networks:
      - swarm-ops_private
      - zenox-staging_private
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M
      placement:
        constraints:
          - node.hostname == Lifty

volumes:
  zenox-staging-data:

networks:
  swarm-ops_private:
    external: true
  zenox-staging_private:
    external: true
  zenox-staging_public:

secrets:
  zenox_staging_bot_token:
    external: true
  zenox_staging_discord_dev_guild_id:
    external: true
  zenox_staging_sentry_dsn:
    external: true
  zenox_staging_youtube_api_key:
    external: true
  zenox_staging_seeleland_api_url:
    external: true
  zenox_staging_db_url:
    external: true
  zenox_staging_discord_webhook:
    external: true
  zenox_staging_hoyolab_username:
    external: true
  zenox_staging_hoyolab_password:
    external: true
